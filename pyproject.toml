[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bstock-web3-engine"
version = "1.0.2"
description = "Standalone Binance bStock market-data, replay and guarded Agentic Wallet execution engine"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "pyarrow>=14",
]

[project.optional-dependencies]
desktop = ["PyQt5>=5.15", "pyqtgraph>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bstock-engine = "bstock_web3.cli:main"
bstock-history = "bstock_web3.history:main"
bstock-backtest = "bstock_web3.backtest:main"
bstock-desktop = "bstock_web3.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

